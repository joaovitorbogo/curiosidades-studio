<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Curiosidades Studio — conectando instagram</title>
<style>body{font-family:Inter,Segoe UI,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#0f1216;color:#e8ecf1;text-align:center}code{color:#ffd23f}</style></head>
<body><div><h2>Conectando instagram ao Curiosidades Studio…</h2><p id="m">Encaminhando a autorização para o painel no seu computador.</p></div>
<script>
// Ponte: a rede manda o código de autorização para esta página pública e ela repassa ao Studio local.
(function(){var q=location.search||'';var alvo='http://localhost:4747/oauth/instagram/callback'+q;
if(!q){document.getElementById('m').textContent='Nada para encaminhar. Abra o painel em http://localhost:4747/ui/#/contas e clique em Conectar.';return;}
document.getElementById('m').innerHTML='Se nada acontecer, abra o painel e clique: <a style="color:#ffd23f" href="'+alvo+'">continuar</a>';
location.replace(alvo);})();
</script></body></html>
